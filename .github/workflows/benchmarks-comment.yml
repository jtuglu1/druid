name: "Benchmarks Comment"

# Pull requests from forks get a read-only GITHUB_TOKEN, so the Benchmarks workflow cannot
# post its own report. This companion runs in the context of the base repository, where it
# has a write-scoped token, and only ever reads an artifact -- it never checks out or
# executes pull request code, which is what makes it safe to give write permission here.
on:
  workflow_run:
    workflows: ["Benchmarks"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' }}
    name: "Post benchmark report"
    runs-on: ubuntu-latest
    steps:
      - name: Download benchmark results
        uses: actions/download-artifact@v8
        with:
          name: benchmark-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results

      - name: Upsert report comment
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');

            const numberPath = 'results/pr-number.txt';
            const reportPath = 'results/comment.md';
            if (!fs.existsSync(numberPath) || !fs.existsSync(reportPath)) {
              core.info('No benchmark report to post.');
              return;
            }

            const issue_number = parseInt(fs.readFileSync(numberPath, 'utf8').trim(), 10);
            if (!Number.isInteger(issue_number)) {
              core.setFailed('Could not read a pull request number from the artifact.');
              return;
            }
            const body = fs.readFileSync(reportPath, 'utf8');

            // The report is written with this sentinel as its first line, so repeated runs
            // on the same PR update one comment rather than piling up new ones.
            const marker = '<!-- druid-benchmark-report -->';
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body,
              });
            }
